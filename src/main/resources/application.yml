spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # 진입 경로. /swagger-ui/index.html 로 두면 springdoc 이 /swagger-ui + 이 값으로
    # 리다이렉트해 /swagger-ui/swagger-ui/index.html 이 되어 UI 가 깨진다.
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.type.descriptor.sql.BasicBinder: trace

---
# MySQL 없이 애플리케이션만 띄워 Swagger/엔드포인트를 확인할 때 쓰는 개발 전용 프로파일
# 실행: ./gradlew bootRun --args='--spring.profiles.active=local-h2'
spring:
  config:
    activate:
      on-profile: local-h2
  datasource:
    url: jdbc:h2:mem:echo8485;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
